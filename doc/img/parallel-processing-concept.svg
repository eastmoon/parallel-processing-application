<svg viewBox="0 0 1380 200" width="1380" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B06B8C"/>
    </marker>
    <style>
      .label {
        font-family: 'Patrick Hand','Segoe Print','Comic Sans MS','Marker Felt','Noto Sans CJK TC','Noto Sans CJK SC',cursive,sans-serif;
        text-anchor: middle;
      }
      .tag {
        font-family: 'Patrick Hand','Segoe Print','Comic Sans MS','Marker Felt','Noto Sans CJK TC','Noto Sans CJK SC',cursive,sans-serif;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Box 1: Application Interface -->
  <g>
    <rect x="40" y="60" width="320" height="100" rx="10" ry="10"
          fill="#6B8CB0" fill-opacity="0.08" stroke="#6B8CB0" stroke-width="2.4"/>
    <rect x="43" y="63" width="320" height="100" rx="10" ry="10"
          fill="none" stroke="#6B8CB0" stroke-width="1.3"
          transform="rotate(0.5 203 113)"/>
    <text class="label" x="200" y="119" font-size="26" fill="#6B8CB0">Application Interface</text>
  </g>

  <!-- Box 2: Worker-Manager -->
  <g>
    <rect x="560" y="60" width="240" height="100" rx="10" ry="10"
          fill="#8D7FB0" fill-opacity="0.08" stroke="#8D7FB0" stroke-width="2.4"/>
    <rect x="563" y="63" width="240" height="100" rx="10" ry="10"
          fill="none" stroke="#8D7FB0" stroke-width="1.3"
          transform="rotate(0.5 683 113)"/>
    <text class="label" x="680" y="119" font-size="26" fill="#8D7FB0">WorkManager</text>
  </g>

  <!-- Box 3: Command-Line Interface -->
  <g>
    <rect x="1000" y="60" width="340" height="100" rx="10" ry="10"
          fill="#7FA66B" fill-opacity="0.08" stroke="#7FA66B" stroke-width="2.4"/>
    <rect x="1003" y="63" width="340" height="100" rx="10" ry="10"
          fill="none" stroke="#7FA66B" stroke-width="1.3"
          transform="rotate(0.5 1173 113)"/>
    <text class="label" x="1170" y="119" font-size="26" fill="#7FA66B">Command-Line Interface</text>
  </g>

  <!-- Arrow 1: Application Interface -> Worker-Manager -->
  <line x1="362" y1="110" x2="558" y2="110" stroke="#B06B8C" stroke-width="2.2"
        stroke-linecap="round" marker-end="url(#arrowhead-rose)"/>
  <text class="tag" x="460" y="92" font-size="19" fill="#B06B8C">IPC ( Socket )</text>

  <!-- Arrow 2: Command-Line Interface -> Worker-Manager -->
  <line x1="998" y1="110" x2="802" y2="110" stroke="#B06B8C" stroke-width="2.2"
        stroke-linecap="round" marker-end="url(#arrowhead-rose)"/>
  <text class="tag" x="900" y="92" font-size="19" fill="#B06B8C">IPC ( Socket )</text>
</svg>
